name: Keep Render Awake

on:
  schedule:
    # 08:55 Warsaw — wake the free instance before the team arrives
    - cron: "55 8 * * 1-5"
      timezone: "Europe/Warsaw"

    # Every 10 minutes, 09:00–16:50. Render sleeps after 15 idle minutes.
    - cron: "*/10 9-16 * * 1-5"
      timezone: "Europe/Warsaw"

    # Last ping at 17:00, then the service may sleep
    - cron: "0 17 * * 1-5"
      timezone: "Europe/Warsaw"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -fsS --max-time 120 \
            https://fundsquare-isin-scraper.onrender.com/ \
            > /dev/null
          echo "Render ping successful"
